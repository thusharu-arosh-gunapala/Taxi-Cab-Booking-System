<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ride reviews</title>
    <style>
        :root { --ink:#1f2328; --muted:#5d6570; --line:#d9dde2; --bg:#f6f7f8; --card:#fff; --accent:#e5a900; --danger:#b42318; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
        main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
        h1 { font-size: 1.9rem; margin: 0 0 4px; }
        h2 { font-size: 1.15rem; margin: 0 0 12px; }
        .sub { color:var(--muted); margin:0 0 28px; }
        .grid { display:grid; grid-template-columns: 340px 1fr; gap: 24px; align-items:start; }
        @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
        section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; }
        label { display:block; font-size:.9rem; margin:12px 0 4px; }
        input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
        input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
        textarea { resize: vertical; min-height: 80px; }
        button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; }
        button.plain { background:transparent; color:var(--ink); border-color:var(--line); }
        button.danger { background:transparent; color:var(--danger); border-color:var(--line); }
        .row { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
        .filter { display:flex; gap:8px; margin-bottom:12px; }
        .filter input { flex:1; }
        .avg { background:#fff7db; border:1px solid #f0d77a; border-radius:6px; padding:10px 12px; margin-bottom:12px; display:none; }
        .review { border-top:1px solid var(--line); padding:14px 0; }
        .review:first-of-type { border-top:none; }
        .stars { color:var(--accent); letter-spacing:2px; }
        .meta { color:var(--muted); font-size:.85rem; }
        .msg { margin-top:12px; font-size:.9rem; }
        .msg.err { color:var(--danger); }
        .empty { color:var(--muted); padding:12px 0; }
    </style>
</head>
<body>
<main>
    <h1>Ride reviews</h1>
    <p class="sub">Rate your driver after a completed trip, or browse what other passengers said.</p>

    <div class="grid">
        <section>
            <h2 id="formTitle">Write a review</h2>
            <div id="createOnly">
                <label for="passengerId">Passenger ID</label>
                <input id="passengerId" placeholder="P001">
                <label for="driverId">Driver ID</label>
                <input id="driverId" placeholder="D001">
                <label for="bookingId">Booking ID</label>
                <input id="bookingId" placeholder="B001">
            </div>
            <label for="rating">Rating</label>
            <select id="rating">
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Good</option>
                <option value="3">3 - Okay</option>
                <option value="2">2 - Poor</option>
                <option value="1">1 - Very poor</option>
            </select>
            <label for="comment">Comment (max 300 characters)</label>
            <textarea id="comment" maxlength="300"></textarea>
            <div class="row">
                <button id="saveBtn">Submit review</button>
                <button id="cancelBtn" class="plain" hidden>Cancel edit</button>
            </div>
            <div id="msg" class="msg" role="status"></div>
        </section>

        <section>
            <h2>All reviews</h2>
            <div class="filter">
                <input id="filterDriver" placeholder="Filter by Driver ID, e.g. D001" aria-label="Filter by driver ID">
                <button id="filterBtn" class="plain">Filter</button>
                <button id="clearBtn" class="plain">Clear</button>
            </div>
            <div id="avg" class="avg"></div>
            <div id="list"></div>
        </section>
    </div>
</main>

<script>
    let editingId = null;
    const $ = (id) => document.getElementById(id);

    function stars(n) { return "\u2605".repeat(n) + "\u2606".repeat(5 - n); }

    function showMsg(text, isError) {
        const m = $("msg");
        m.textContent = text;
        m.className = "msg" + (isError ? " err" : "");
    }

    async function api(url, options) {
        const res = await fetch(url, options);
        if (!res.ok) {
            let message = "Something went wrong.";
            try { message = (await res.json()).message || message; } catch (e) { /* no body */ }
            throw new Error(message);
        }
        return res.status === 204 ? null : res.json();
    }

    async function loadReviews() {
        const driver = $("filterDriver").value.trim();
        const reviews = await api("/api/reviews" + (driver ? "?driverId=" + encodeURIComponent(driver) : ""));
        const list = $("list");
        list.replaceChildren();

        if (reviews.length === 0) {
            const p = document.createElement("p");
            p.className = "empty";
            p.textContent = "No reviews yet. Be the first to write one.";
            list.append(p);
        }
        reviews.forEach((r) => list.append(renderReview(r)));

        const avg = $("avg");
        if (driver && reviews.length > 0) {
            const rating = await api("/api/drivers/" + encodeURIComponent(driver) + "/rating");
            avg.textContent = "Driver " + rating.driverId + ": " + rating.averageRating.toFixed(1) +
                " average from " + rating.totalReviews + (rating.totalReviews === 1 ? " review" : " reviews");
            avg.style.display = "block";
        } else {
            avg.style.display = "none";
        }
    }

    function renderReview(r) {
        const div = document.createElement("div");
        div.className = "review";

        const s = document.createElement("div");
        s.className = "stars";
        s.textContent = stars(r.rating);

        const text = document.createElement("div");
        text.textContent = r.comment || "(no comment)";

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = r.reviewId + " | Driver " + r.driverId + " | Booking " + r.bookingId +
            " | by " + r.passengerId + " | " + r.createdDate;

        const actions = document.createElement("div");
        actions.className = "row";
        const edit = document.createElement("button");
        edit.className = "plain";
        edit.textContent = "Edit review";
        edit.onclick = () => startEdit(r);
        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Delete review";
        del.onclick = () => removeReview(r.reviewId);
        actions.append(edit, del);

        div.append(s, text, meta, actions);
        return div;
    }

    function startEdit(r) {
        editingId = r.reviewId;
        $("formTitle").textContent = "Edit review " + r.reviewId;
        $("createOnly").style.display = "none";
        $("rating").value = r.rating;
        $("comment").value = r.comment;
        $("saveBtn").textContent = "Save changes";
        $("cancelBtn").hidden = false;
        showMsg("", false);
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
        editingId = null;
        $("formTitle").textContent = "Write a review";
        $("createOnly").style.display = "block";
        ["passengerId", "driverId", "bookingId", "comment"].forEach((id) => { $(id).value = ""; });
        $("rating").value = "5";
        $("saveBtn").textContent = "Submit review";
        $("cancelBtn").hidden = true;
    }

    async function removeReview(id) {
        if (!confirm("Delete review " + id + "?")) return;
        try {
            await api("/api/reviews/" + id, { method: "DELETE" });
            showMsg("Review deleted.", false);
            loadReviews();
        } catch (e) { showMsg(e.message, true); }
    }

    $("saveBtn").onclick = async () => {
        const body = { rating: Number($("rating").value), comment: $("comment").value.trim() };
        try {
            if (editingId) {
                await api("/api/reviews/" + editingId, {
                    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
                });
                showMsg("Review updated.", false);
            } else {
                body.passengerId = $("passengerId").value.trim();
                body.driverId = $("driverId").value.trim();
                body.bookingId = $("bookingId").value.trim();
                await api("/api/reviews", {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
                });
                showMsg("Review submitted.", false);
            }
            resetForm();
            loadReviews();
        } catch (e) { showMsg(e.message, true); }
    };

    $("cancelBtn").onclick = () => { resetForm(); showMsg("", false); };
    $("filterBtn").onclick = loadReviews;
    $("clearBtn").onclick = () => { $("filterDriver").value = ""; loadReviews(); };

    loadReviews();
</script>
</body>
</html>
