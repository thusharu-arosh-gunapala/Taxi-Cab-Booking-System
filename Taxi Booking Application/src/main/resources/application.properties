spring.application.name=taxi-booking-web
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:h2:mem:taxibooking;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
server.error.include-message=never
logging.level.com.serendib.taxibooking=INFO

app.fare.currency=LKR
app.maps.geoapify-api-key=${GEOAPIFY_API_KEY:}
app.maps.geoapify-base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}
app.maps.geoapify-tile-url=${GEOAPIFY_TILE_URL:https://maps.geoapify.com/v1/tile/carto/{z}/{x}/{y}.png}
app.maps.nearby-driver-radius-km=${NEARBY_DRIVER_RADIUS_KM:5}
app.maps.driver-location-max-age-seconds=${DRIVER_LOCATION_MAX_AGE_SECONDS:120}
app.integrations.driver-token=${DRIVER_INTEGRATION_TOKEN:}
app.payment.base-url=${APP_BASE_URL:http://localhost:8081}
app.payment.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.webhook-tolerance-seconds=${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
spring.mail.host=${MAIL_HOST:${SMTP_HOST:live.smtp.mailtrap.io}}
spring.mail.port=${MAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SMTP_USERNAME:apismtp@mailtrap.io}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
app.mail.from=${MAIL_FROM:serendibride@admin.com}
app.mail.mailtrap.api-token=${MAILTRAP_API_TOKEN:}
app.mail.mailtrap.api-url=${MAILTRAP_API_URL:https://send.api.mailtrap.io/api/send}
app.support.email=${SUPPORT_EMAIL:support@serendibride.local}
app.driver.upload-directory=${DRIVER_UPLOAD_DIR:./var/driver-uploads}
app.admin.name=${ADMIN_NAME:Site Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
