<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset driver password | Serendib Ride</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="content-shell">
    <section class="panel form-panel">
        <p class="eyebrow">DRIVER ACCOUNT SECURITY</p>
        <h1>Forgot your password?</h1>
        <p>Enter your approved driver account email. If eligible, we will send a secure reset link.</p>
        <div th:if="${notice}" class="alert alert-success" role="status" th:text="${notice}"></div>
        <form th:action="@{/driver/forgot-password}" th:object="${requestForm}" method="post" class="stack-form">
            <label for="email">Driver email address</label>
            <input id="email" th:field="*{email}" type="email" autocomplete="email" maxlength="254" required>
            <p class="field-error" th:errors="*{email}"></p>
            <button class="button" type="submit">Send reset link</button>
        </form>
        <p class="muted"><a th:href="@{/login?driver}">Return to driver sign in</a></p>
    </section>
</main>
</body>
</html>
