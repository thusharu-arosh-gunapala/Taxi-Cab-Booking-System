<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change temporary password | Serendib Ride</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="content-shell">
    <section class="panel form-panel">
        <p class="eyebrow">DRIVER ACCOUNT SECURITY</p>
        <h1>Choose a new password</h1>
        <p>Your temporary password must be replaced before you can access the driver dashboard.</p>
        <div th:if="${passwordError}" class="alert alert-error" role="alert" th:text="${passwordError}"></div>
        <form th:action="@{/driver/change-password}" th:object="${passwordForm}" method="post" class="stack-form">
            <label for="password">New password</label>
            <input id="password" th:field="*{password}" type="password" minlength="12" maxlength="72"
                   autocomplete="new-password" required>
            <p class="field-error" th:errors="*{password}"></p>
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" th:field="*{confirmPassword}" type="password" minlength="12" maxlength="72"
                   autocomplete="new-password" required>
            <p class="field-error" th:errors="*{confirmPassword}"></p>
            <p class="muted">Use at least 12 characters. Never share your password with anyone.</p>
            <button class="button" type="submit">Change password</button>
        </form>
    </section>
</main>
</body>
</html>
