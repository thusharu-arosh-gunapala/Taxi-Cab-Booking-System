<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new driver password | Serendib Ride</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments/nav :: navigation}"></header>
<main class="content-shell">
    <section class="panel form-panel">
        <p class="eyebrow">DRIVER ACCOUNT SECURITY</p>
        <h1>Choose a new password</h1>
        <div th:if="${resetError}" class="alert alert-error" role="alert" th:text="${resetError}"></div>
        <div th:if="${validToken}">
            <p>This link expires after 30 minutes and can be used once.</p>
            <form th:action="@{/driver/reset-password}" th:object="${passwordForm}" method="post" class="stack-form">
                <input type="hidden" name="token" th:value="${token}">
                <label for="password">New password</label>
                <input id="password" th:field="*{password}" type="password" minlength="12" maxlength="72"
                       autocomplete="new-password" required>
                <p class="field-error" th:errors="*{password}"></p>
                <label for="confirmPassword">Confirm new password</label>
                <input id="confirmPassword" th:field="*{confirmPassword}" type="password" minlength="12" maxlength="72"
                       autocomplete="new-password" required>
                <p class="field-error" th:errors="*{confirmPassword}"></p>
                <button class="button" type="submit">Reset password</button>
            </form>
        </div>
        <div th:unless="${validToken}">
            <p class="muted">Request a new link to continue.</p>
            <a class="button button-secondary" th:href="@{/driver/forgot-password}">Request another reset link</a>
        </div>
    </section>
</main>
</body>
</html>
